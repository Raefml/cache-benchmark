spring:
  application:
    name: cache-performance-benchmark

  datasource:
    url: jdbc:postgresql://localhost:5432/cachedb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=600s

# Redis Configuration (also used for Valkey, DragonflyDB, KeyDB)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms

# Server Configuration
server:
  port: 8080
  compression:
    enabled: true
  tomcat:
    threads:
      max: 200
      min-spare: 10

# Management & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches
      base-path: /actuator
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true

# Logging
logging:
  level:
    root: INFO
    com.cacheperf: DEBUG
    org.springframework.cache: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Cache Provider Configuration
cache:
  providers:
    redis:
      host: localhost
      port: 6379
      timeout: 2000
    valkey:
      host: localhost
      port: 6380
      timeout: 2000
    dragonflydb:
      host: localhost
      port: 6381
      timeout: 2000
    keydb:
      host: localhost
      port: 6382
      timeout: 2000
    memcached:
      servers: localhost:11211
      timeout: 2000
    hazelcast:
      cluster-name: cache-benchmark-cluster
      network:
        port: 5701
        join:
          multicast:
            enabled: false
          tcp-ip:
            enabled: true
            members:
              - localhost
    ignite:
      instance-name: ignite-cache-benchmark
      client-mode: false

# Benchmark Configuration
benchmark:
  warmup-iterations: 1000
  test-iterations: 10000
  concurrent-users: 50
  data-size: 10000
