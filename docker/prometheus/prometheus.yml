global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'cache-benchmark'

scrape_configs:
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['172.25.0.1:8080']
        labels:
          application: 'cache-performance-benchmark'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
